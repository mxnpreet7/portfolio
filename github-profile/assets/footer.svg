<svg width="900" height="80" viewBox="0 0 900 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E23636" stop-opacity="0" />
      <stop offset="50%" stop-color="#E23636" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E23636" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .footer-text {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #A1A1AA;
      text-transform: uppercase;
    }
    .footer-sub {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      fill: #52525B;
    }
  </style>

  <!-- Top hairline border -->
  <line x1="100" y1="0" x2="800" y2="0" stroke="url(#footerLineGrad)" stroke-width="1" />

  <!-- Spider-Web Emblem Icon (Geometric) -->
  <g transform="translate(450, 24)">
    <circle cx="0" cy="0" r="10" stroke="#E23636" stroke-opacity="0.3" stroke-width="0.8" />
    <circle cx="0" cy="0" r="5" stroke="#FF3344" stroke-opacity="0.6" stroke-width="0.8" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#E23636" stroke-opacity="0.4" stroke-width="0.8" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#E23636" stroke-opacity="0.4" stroke-width="0.8" />
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#E23636" stroke-opacity="0.3" stroke-width="0.8" />
    <line x1="-8" y1="8" x2="8" y2="-8" stroke="#E23636" stroke-opacity="0.3" stroke-width="0.8" />
    <circle cx="0" cy="0" r="1.5" fill="#FF3344" />
  </g>

  <!-- Center Text -->
  <text x="450" y="52" text-anchor="middle" class="footer-text">
    Built with curiosity <tspan fill="#E23636">•</tspan> Coded with intent
  </text>
  <text x="450" y="68" text-anchor="middle" class="footer-sub">
    MANPREET SINGH // MXNPREET7 • CHANDIGARH, INDIA
  </text>
</svg>
